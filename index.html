<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중화 반응 실험실 - 학생용</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6">
    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- 로그인 영역 -->
        <div id="login-container" class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8 text-center border border-slate-100 mt-20">
            <h1 class="text-xl font-bold text-slate-800 mb-2">학생용 구글 로그인</h1>
            <p class="text-slate-500 mb-6 text-sm">구글 계정으로 로그인하여 수업 참여를 신청하세요.</p>
            
            <div id="login-btn-box">
                <button id="google-login-btn" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition shadow-md">
                    구글 계정으로 로그인
                </button>
            </div>

            <div id="pending-box" class="hidden space-y-4">
                <div class="p-4 bg-amber-50 text-amber-800 rounded-lg text-sm">
                    선생님의 승인을 기다리고 있습니다. 승인이 완료되면 실험 화면이 열립니다.
                </div>
                <button id="logout-btn-1" class="text-sm text-slate-500 hover:text-slate-800 underline">다른 계정으로 로그인</button>
            </div>
        </div>

        <!-- 실험 화면 영역 -->
        <div id="app-container" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold text-slate-800">중화 반응 실험 기록</h1>
                    <p class="text-sm text-slate-500" id="user-info">사용자 확인 중...</p>
                </div>
                <button id="logout-btn-2" class="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 text-sm font-semibold rounded-lg transition">로그아웃</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                    <h2 class="font-bold text-slate-700">데이터 입력</h2>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">염기성 용액 첨가량 (mL)</label>
                        <input type="number" id="volume-input" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" placeholder="예: 5">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">측정 온도 (°C)</label>
                        <input type="number" id="temp-input" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" placeholder="예: 21.5" step="0.1">
                    </div>
                    <button id="add-data-btn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition text-sm">측정값 추가하기</button>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                    <h2 class="font-bold text-slate-700">온도 변화 그래프</h2>
                    <div class="relative h-48">
                        <canvas id="tempChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-2">
                <h2 class="font-bold text-slate-700">선생님 피드백</h2>
                <div id="feedback-box" class="p-4 bg-slate-50 rounded-lg text-sm text-slate-600">
                    아직 작성된 피드백이 없습니다.
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaM5AWJnW5CX5GccGIOSdhdMICUN8jr8E",
            authDomain: "hwangyung.firebaseapp.com",
            projectId: "hwangyung",
            storageBucket: "hwangyung.firebasestorage.app",
            messagingSenderId: "560973293174",
            appId: "1:560973293174:web:eb4e938aaa459669356157",
            measurementId: "G-PTJFPZKV9T"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        let currentUser = null;
        let experimentData = [];
        
        const ctx = document.getElementById('tempChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{ label: '온도 (°C)', data: [], borderColor: 'rgb(79, 70, 229)', tension: 0.1 }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // 리디렉션 방식 로그인 요청
        document.getElementById("google-login-btn").addEventListener("click", async () => {
            try {
                await signInWithRedirect(auth, googleProvider);
            } catch (error) {
                alert("로그인 오류: " + error.message);
            }
        });

        const handleLogout = () => signOut(auth);
        document.getElementById("logout-btn-1").addEventListener("click", handleLogout);
        document.getElementById("logout-btn-2").addEventListener("click", handleLogout);

        // 로그인 복귀 후 결과 처리 및 상태 감지
        getRedirectResult(auth).catch((error) => console.error(error));

        onAuthStateChanged(auth, async (user) => {
            const loginContainer = document.getElementById("login-container");
            const appContainer = document.getElementById("app-container");
            const loginBtnBox = document.getElementById("login-btn-box");
            const pendingBox = document.getElementById("pending-box");

            if (!user) {
                currentUser = null;
                loginContainer.classList.remove("hidden");
                appContainer.classList.add("hidden");
                loginBtnBox.classList.remove("hidden");
                pendingBox.classList.add("hidden");
                return;
            }

            currentUser = user;
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    email: user.email,
                    name: user.displayName,
                    role: "student",
                    status: "pending",
                    createdAt: new Date().toISOString()
                });
                loginBtnBox.classList.add("hidden");
                pendingBox.classList.remove("hidden");
            } else {
                const data = userSnap.data();
                if (data.status === "approved") {
                    loginContainer.classList.add("hidden");
                    appContainer.classList.remove("hidden");
                    document.getElementById("user-info").textContent = `${user.displayName} (${user.email})`;
                    loadStudentData(user.uid);
                } else {
                    loginBtnBox.classList.add("hidden");
                    pendingBox.classList.remove("hidden");
                }
            }
        });

        async function loadStudentData(uid) {
            const docRef = doc(db, "experiments", uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                experimentData = data.records || [];
                updateChart();
                if (data.feedback) {
                    document.getElementById("feedback-box").textContent = data.feedback;
                }
            }
        }

        document.getElementById("add-data-btn").addEventListener("click", async () => {
            const vol = parseFloat(document.getElementById("volume-input").value);
            const temp = parseFloat(document.getElementById("temp-input").value);

            if (isNaN(vol) || isNaN(temp)) {
                alert("올바른 숫자 값을 입력해 주세요.");
                return;
            }

            experimentData.push({ volume: vol, temperature: temp });
            experimentData.sort((a, b) => a.volume - b.volume);

            const docRef = doc(db, "experiments", currentUser.uid);
            await setDoc(docRef, {
                studentId: currentUser.uid,
                studentName: currentUser.displayName,
                studentEmail: currentUser.email,
                records: experimentData,
                updatedAt: new Date().toISOString()
            }, { merge: true });

            updateChart();
            document.getElementById("volume-input").value = "";
            document.getElementById("temp-input").value = "";
        });

        function updateChart() {
            chart.data.labels = experimentData.map(d => `${d.volume}mL`);
            chart.data.datasets[0].data = experimentData.map(d => d.temperature);
            chart.update();
        }
    </script>
</body>
</html>
